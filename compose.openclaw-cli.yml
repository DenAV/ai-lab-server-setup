# Legacy overlay for deployments where the Gateway and sandbox share a Docker daemon.
services:
  openclaw:
    image: openclaw-sandbox-client:2026.9.9-docker29.8.0
    build:
      context: .
      dockerfile: Dockerfile.openclaw-sandbox
    environment:
      DOCKER_HOST: unix:///run/openclaw-sandbox/docker.sock
    volumes:
      - type: bind
        source: /home/node/.openclaw/sandbox/skills-workspaces
        target: /home/node/.openclaw/sandbox/skills-workspaces
        bind:
          create_host_path: false
