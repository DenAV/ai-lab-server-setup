name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint

      - name: Bash syntax check
        run: |
          bash -n setup.sh
          bash -n scripts/generate-env.sh
          bash -n scripts/validate.sh
          bash -n scripts/collect-diagnostics.sh

      - name: ShellCheck
        run: |
          shellcheck --severity=error setup.sh
          shellcheck --severity=error scripts/generate-env.sh
          shellcheck --severity=error scripts/validate.sh
          shellcheck --severity=error scripts/collect-diagnostics.sh

      - name: Docker Compose availability
        run: docker compose version

      - name: YAML lint
        run: |
          yamllint docker-compose.yml
          yamllint config/components.yml
          yamllint config/litellm-config.yml
          yamllint config/litellm-contracts.yml
          yamllint examples/cloud-config.yml

      - name: Repository tests
        run: bash tests/test_repo.sh
