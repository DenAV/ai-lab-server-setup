schema_version: 1

compose_files:
  - docker-compose.yml
  - docker-compose.workers.yml
  - compose.openclaw-cli.yml

presets:
  n8n-cloud:
    description: n8n with the internal LiteLLM gateway
    components: [traefik, n8n, litellm]
  dify-cloud:
    description: Dify with Qdrant and the internal LiteLLM gateway
    components: [traefik, dify, qdrant, litellm]
  openclaw:
    description: Loopback-only OpenClaw Gateway
    components: [traefik, openclaw]

resource_baseline:
  status: observed-idle
  measured_at: "2026-10-03T09:47:12Z"
  source_revision: 3956f298f138b219ba343b1e07c27acef67d3753
  samples: 6
  interval_seconds: 10
  host:
    vcpus: 4
    memory_mib: 7746
    swap_mib: 4096
    root_disk_gib: 149.9
    root_disk_available_gib: 52.8
    docker_version: 29.8.0
    compose_version: 5.5.1
  stack:
    managed_memory_mib_max: 4031
    managed_cpu_percent_peak: 22.2
    logical_image_size_mib: 15579
    persistent_data_mib: 1999
  host_classes:
    minimum:
      vcpus: 2
      memory_mib: 4096
      disk_gib: 40
      evidence: projected
      fit: base-components-only
    recommended:
      vcpus: 4
      memory_mib: 8192
      disk_gib: 80
      evidence: observed
      fit: full-cloud-stack-idle
    expanded:
      vcpus: 8
      memory_mib: 16384
      disk_gib: 80
      evidence: projected
      fit: full-cloud-stack-with-headroom

host_prerequisites:
  cca-host-path: Shared n8n and FFmpeg worker data path exists with UID 1000 access
  dify-volume-ownership: Dify storage volume is writable by the image runtime UID
  docker-api-compat: Docker daemon exposes an API version supported by Traefik
  docker-socket: Rootful Docker socket is available read-only to Traefik
  ffmpeg-image-build: Docker can build the repository-managed FFmpeg worker image
  loopback-ssh-tunnel: Operator can reach the loopback-only Gateway through SSH
  model-capacity: Host has enough RAM and disk for explicitly selected models
  openclaw-rootless-sandbox: Dedicated rootless Docker socket and workspace paths exist
  ports-80-443: Host firewall and upstream network permit inbound TCP 80 and 443
  public-dns: Required public hostnames resolve to the server

components:
  demo-db:
    description: Shared PostgreSQL database for demo projects
    required: false
    services: [demo-db]
    compose_files: [docker-compose.yml]
    profile: demo-db
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [ai-net]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: demo-db-data
        target: /var/lib/postgresql/data
        read_only: false
        backup: required
        sensitive: true
    routes: []
    secrets: [DEMO_DB_PASSWORD]
    health_checks: [demo-db]
    resources:
      status: observed-idle
      memory_mib_max: 10.4
      cpu_percent_peak: 3.54
    host_prerequisites:
      required: []
      conditional: {}

  dify:
    description: Dify application, workers, gateways, and internal dependencies
    required: false
    services:
      - dify-api
      - dify-beat
      - dify-db
      - dify-nginx
      - dify-plugin-daemon
      - dify-redis
      - dify-sandbox
      - dify-web
      - dify-worker
    compose_files: [docker-compose.yml]
    profile: dify
    dependencies:
      required: [qdrant]
      optional: [ollama]
    conflicts: []
    networks: [ai-net, traefik-public]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: dify-db-data
        target: /var/lib/postgresql/data
        read_only: false
        backup: required
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-plugin-data
        target: /app/storage
        read_only: false
        backup: required
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-redis-data
        target: /data
        read_only: false
        backup: unresolved
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-sandbox-deps
        target: /dependencies
        read_only: false
        backup: reconstructible
        sensitive: false
      - type: volume
        compose_file: docker-compose.yml
        source: dify-storage
        target: /app/api/storage
        read_only: false
        backup: required
        sensitive: true
      - type: bind
        compose_file: docker-compose.yml
        source: ./config/dify-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        backup: repository
        sensitive: false
    routes: ["https://dify.${DOMAIN}"]
    secrets:
      - DIFY_DB_PASSWORD
      - DIFY_PLUGIN_DAEMON_KEY
      - DIFY_PLUGIN_INNER_API_KEY
      - DIFY_REDIS_PASSWORD
      - DIFY_SANDBOX_KEY
      - DIFY_SECRET_KEY
      - QDRANT_API_KEY
    health_checks: [dify-api, dify-db, dify-nginx, dify-redis, dify-sandbox]
    resources:
      status: observed-idle
      memory_mib_max: 2562.0
      cpu_percent_peak: 13.51
    host_prerequisites:
      required: [dify-volume-ownership, public-dns]
      conditional: {}

  ffmpeg-worker:
