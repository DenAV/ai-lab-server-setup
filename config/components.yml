schema_version: 1

compose_files:
  - docker-compose.yml
  - docker-compose.workers.yml
  - compose.openclaw-cli.yml

host_prerequisites:
  cca-host-path: Shared n8n and FFmpeg worker data path exists with UID 1000 access
  dify-volume-ownership: Dify storage volume is writable by the image runtime UID
  docker-api-compat: Docker daemon exposes an API version supported by Traefik
  docker-socket: Rootful Docker socket is available read-only to Traefik
  ffmpeg-image-build: Docker can build the repository-managed FFmpeg worker image
  loopback-ssh-tunnel: Operator can reach the loopback-only Gateway through SSH
  model-capacity: Host has enough RAM and disk for explicitly selected models
  openclaw-rootless-sandbox: Dedicated rootless Docker socket and workspace paths exist
  ports-80-443: Host firewall and upstream network permit inbound TCP 80 and 443
  public-dns: Required public hostnames resolve to the server

components:
  demo-db:
    description: Shared PostgreSQL database for demo projects
    required: false
    services: [demo-db]
    compose_files: [docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [ai-net]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: demo-db-data
        target: /var/lib/postgresql/data
        read_only: false
        backup: required
        sensitive: true
    routes: []
    secrets: [DEMO_DB_PASSWORD]
    health_checks: [demo-db]
    host_prerequisites:
      required: []
      conditional: {}

  dify:
    description: Dify application, workers, gateways, and internal dependencies
    required: false
    services:
      - dify-api
      - dify-beat
      - dify-db
      - dify-nginx
      - dify-plugin-daemon
      - dify-redis
      - dify-sandbox
      - dify-web
      - dify-worker
    compose_files: [docker-compose.yml]
    profile: null
    dependencies:
      required: [qdrant]
      optional: [ollama]
    conflicts: []
    networks: [ai-net, traefik-public]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: dify-db-data
        target: /var/lib/postgresql/data
        read_only: false
        backup: required
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-plugin-data
        target: /app/storage
        read_only: false
        backup: required
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-redis-data
        target: /data
        read_only: false
        backup: unresolved
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: dify-sandbox-deps
        target: /dependencies
        read_only: false
        backup: reconstructible
        sensitive: false
      - type: volume
        compose_file: docker-compose.yml
        source: dify-storage
        target: /app/api/storage
        read_only: false
        backup: required
        sensitive: true
      - type: bind
        compose_file: docker-compose.yml
        source: ./config/dify-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        backup: repository
        sensitive: false
    routes: ["https://dify.${DOMAIN}"]
    secrets:
      - DIFY_DB_PASSWORD
      - DIFY_PLUGIN_DAEMON_KEY
      - DIFY_PLUGIN_INNER_API_KEY
      - DIFY_REDIS_PASSWORD
      - DIFY_SANDBOX_KEY
      - DIFY_SECRET_KEY
      - QDRANT_API_KEY
    health_checks: [dify-api, dify-db, dify-nginx, dify-redis, dify-sandbox]
    host_prerequisites:
      required: [dify-volume-ownership, public-dns]
      conditional: {}

  ffmpeg-worker:
    description: Internal media processing worker used by n8n workflows
    required: false
    services: [ffmpeg-worker]
    compose_files: [docker-compose.workers.yml]
    profile: null
    dependencies:
      required: [n8n]
      optional: []
    conflicts: []
    networks: [ai-net]
    storage:
      - type: bind
        compose_file: docker-compose.workers.yml
        source: /home/lab/client-conversation-analyzer-data
        target: /data/cca
        read_only: false
        backup: required
        sensitive: true
    routes: []
    secrets: []
    health_checks: [ffmpeg-worker]
    host_prerequisites:
      required: [cca-host-path, ffmpeg-image-build]
      conditional: {}

  langfuse:
    description: Langfuse application and its PostgreSQL database
    required: false
    services: [langfuse, langfuse-db]
    compose_files: [docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [ai-net, traefik-public]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: langfuse-db-data
        target: /var/lib/postgresql/data
        read_only: false
        backup: required
        sensitive: true
    routes: ["https://trace.${DOMAIN}"]
    secrets:
      - LANGFUSE_DB_PASSWORD
      - LANGFUSE_NEXT_AUTH_SECRET
      - LANGFUSE_SALT
      - LANGFUSE_SECRET_KEY
    health_checks: [langfuse, langfuse-db]
    host_prerequisites:
      required: [public-dns]
      conditional: {}

  n8n:
    description: n8n workflow automation service
    required: false
    services: [n8n]
    compose_files: [docker-compose.workers.yml, docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: [dify, langfuse, ollama, qdrant]
    conflicts: []
    networks: [ai-net, traefik-public]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: n8n-data
        target: /home/node/.n8n
        read_only: false
        backup: required
        sensitive: true
      - type: bind
        compose_file: docker-compose.workers.yml
        source: /home/lab/client-conversation-analyzer-data
        target: /data/cca
        read_only: false
        backup: required
        sensitive: true
    routes: ["https://n8n.${DOMAIN}"]
    secrets: [N8N_BASIC_AUTH_PASSWORD, N8N_ENCRYPTION_KEY]
    health_checks: [n8n]
    host_prerequisites:
      required: [public-dns]
      conditional:
        docker-compose.workers.yml: [cca-host-path]

  ollama:
    description: Optional local model runtime
    required: false
    services: [ollama]
    compose_files: [docker-compose.yml]
    profile: local-model
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [ai-net, openclaw-net]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: ollama-data
        target: /root/.ollama
        read_only: false
        backup: reconstructible
        sensitive: false
    routes: []
    secrets: []
    health_checks: [ollama]
    host_prerequisites:
      required: [model-capacity]
      conditional: {}

  openclaw:
    description: Loopback-only OpenClaw Gateway with optional rootless sandbox client
    required: false
    services: [openclaw]
    compose_files: [compose.openclaw-cli.yml, docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: [ollama]
    conflicts: []
    networks: [openclaw-net]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: openclaw-data
        target: /home/node/.openclaw
        read_only: false
        backup: required
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: openclaw-ssh
        target: /home/node/.ssh
        read_only: false
        backup: required
        sensitive: true
      - type: bind
        compose_file: compose.openclaw-cli.yml
        source: /home/node/.openclaw/sandbox/skills-workspaces
        target: /home/node/.openclaw/sandbox/skills-workspaces
        read_only: false
        backup: recommended
        sensitive: true
    routes: ["http://127.0.0.1:18789"]
    secrets: [OPENCLAW_GATEWAY_TOKEN]
    health_checks: [openclaw]
    host_prerequisites:
      required: [loopback-ssh-tunnel]
      conditional:
        compose.openclaw-cli.yml: [openclaw-rootless-sandbox]

  qdrant:
    description: Internal vector database
    required: false
    services: [qdrant]
    compose_files: [docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [ai-net]
    storage:
      - type: volume
        compose_file: docker-compose.yml
        source: qdrant-data
        target: /qdrant/storage
        read_only: false
        backup: required
        sensitive: true
    routes: []
    secrets: [QDRANT_API_KEY]
    health_checks: []
    host_prerequisites:
      required: []
      conditional: {}

  traefik:
    description: Mandatory public reverse proxy and TLS termination
    required: true
    services: [traefik]
    compose_files: [docker-compose.yml]
    profile: null
    dependencies:
      required: []
      optional: []
    conflicts: []
    networks: [traefik-public]
    storage:
      - type: bind
        compose_file: docker-compose.yml
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        backup: none
        sensitive: true
      - type: volume
        compose_file: docker-compose.yml
        source: traefik-certs
        target: /certs
        read_only: false
        backup: required
        sensitive: true
    routes: ["http://*:80", "https://*:443"]
    secrets: []
    health_checks: []
    host_prerequisites:
      required:
        - docker-api-compat
        - docker-socket
        - ports-80-443
        - public-dns
      conditional: {}
