# AI Learning Platform — Docker Compose
# Profile-based AI platform deployment with mandatory Traefik.
#
# Usage:
#   cp .env.example .env  # edit values
#   # Set COMPOSE_PROFILES; see docs/operations/compose-profiles.md
#   docker compose up -d

networks:
  ai-net:
    driver: bridge
  litellm-backend:
    driver: bridge
    internal: true
  litellm-clients:
    driver: bridge
    internal: true
  litellm-upstreams:
    driver: bridge
    internal: true
  litellm-ingress:
    name: litellm-ingress
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/29
  openclaw-net:
    driver: bridge
  yopass-backend:
    driver: bridge
    internal: true
  traefik-public:
    name: traefik-public
    driver: bridge

volumes:
  n8n-data:
  openclaw-data:
  openclaw-ssh:
  ollama-data:
  qdrant-data:
  langfuse-db-data:
  traefik-certs:
  dify-db-data:
  dify-redis-data:
  dify-storage:
  dify-sandbox-deps:
  dify-plugin-data:
  demo-db-data:
  litellm-db-data:
  litellm-chatgpt-auth:
  yopass-redis-data:

services:
  # ===========================================================================
  # Demo DB — Shared PostgreSQL for demo projects
  # ===========================================================================
  demo-db:
    profiles: ["demo-db"]
    image: "postgres:16-alpine"
    container_name: demo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=${DEMO_DB_PASSWORD}
      - POSTGRES_DB=demo
    volumes:
      - "demo-db-data:/var/lib/postgresql/data"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Yopass — End-to-end encrypted secret sharing
  # ===========================================================================
  yopass-redis:
    profiles: ["yopass"]
    image: "redis:${YOPASS_REDIS_VERSION:-7.4.7-alpine}"
    container_name: yopass-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - "yopass-redis-data:/data"
    networks:
      - yopass-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  yopass:
    profiles: ["yopass"]
    image: "jhaals/yopass:${YOPASS_VERSION:-14.10.0}"
    container_name: yopass
    restart: unless-stopped
    environment:
      - DATABASE=redis
      - REDIS=redis://yopass-redis:6379/0
      - PORT=1337
      - DEFAULT_EXPIRY=1d
      - CORS_ALLOW_ORIGIN=https://yopass.${DOMAIN}
    depends_on:
      yopass-redis:
        condition: service_healthy
    networks:
      - yopass-backend
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.yopass.rule=Host(`yopass.${DOMAIN}`)"
      - "traefik.http.routers.yopass.entrypoints=websecure"
      - "traefik.http.routers.yopass.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yopass.middlewares=secure-headers@docker"
      - "traefik.http.services.yopass.loadbalancer.server.port=1337"
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  # ===========================================================================
  # Traefik — Reverse Proxy with automatic TLS
  # ===========================================================================
  traefik:
    image: "traefik:${TRAEFIK_VERSION:-v3.6}"
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedheaders.trustedips=${TRAEFIK_FORWARDED_HEADERS_TRUSTED_IPS:-127.0.0.1/32}"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    environment:
      - DOCKER_API_VERSION=1.45
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/certs"
    networks:
      - traefik-public
      - litellm-ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secure-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()"
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # n8n — Workflow Automation
  # ===========================================================================
  n8n:
    profiles: ["n8n"]
    image: "n8nio/n8n:${N8N_VERSION:-2.40.7}"
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TIMEZONE}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
      - N8N_ENABLE_EXECUTE_COMMAND=true
      - NODES_EXCLUDE=[]
    volumes:
      - "n8n-data:/home/node/.n8n"
    networks:
      ai-net:
        gw_priority: 1
      litellm-clients: {}
      traefik-public: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.middlewares=secure-headers@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || wget -q --spider http://localhost:5678/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # OpenClaw — Personal AI Assistant Gateway
  # ===========================================================================
  openclaw:
    profiles: ["openclaw"]
    image: "ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION:-2026.9.9}"
    container_name: openclaw
    restart: unless-stopped
    init: true
    environment:
      - HOME=/home/node
      - OPENCLAW_HOME=/home/node
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_DISABLE_BONJOUR=1
      - TZ=${TIMEZONE}
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    volumes:
      - "openclaw-data:/home/node/.openclaw"
      - "openclaw-ssh:/home/node/.ssh"
    networks:
      - openclaw-net
    ports:
      - "127.0.0.1:18789:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # Ollama — Optional Local LLM Runtime
  # ===========================================================================
  ollama:
    profiles: ["local-model"]
    image: "ollama/ollama:${OLLAMA_VERSION:-0.34.0}"
    container_name: ollama-compose
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - "ollama-data:/root/.ollama"
    networks:
      ai-net:
        gw_priority: 1
      litellm-upstreams: {}
      openclaw-net: {}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # Qdrant — Vector Database
  # ===========================================================================
  qdrant:
    profiles: ["qdrant"]
    image: "qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}"
    container_name: qdrant-compose
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - "qdrant-data:/qdrant/storage"
    networks:
      - ai-net

  # ===========================================================================
  # Langfuse — LLM Observability
  # ===========================================================================
  langfuse-db:
    profiles: ["langfuse"]
    image: "postgres:16-alpine"
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}
      - POSTGRES_DB=langfuse
    volumes:
      - "langfuse-db-data:/var/lib/postgresql/data"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    profiles: ["langfuse"]
    image: "langfuse/langfuse:${LANGFUSE_VERSION:-2}"
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=https://trace.${DOMAIN}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXT_AUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - TELEMETRY_ENABLED=false
      - HOSTNAME=0.0.0.0
    networks:
      ai-net:
        gw_priority: 1
      litellm-upstreams: {}
      traefik-public: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`trace.${DOMAIN}`)"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls.certresolver=letsencrypt"
      - "traefik.http.routers.langfuse.middlewares=secure-headers@docker"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # LiteLLM — Internal model gateway and dedicated PostgreSQL database
  # ===========================================================================
  litellm-db:
    profiles: ["litellm"]
    image: "postgres:${LITELLM_DB_VERSION:-16.15-alpine}"
    container_name: litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - "litellm-db-data:/var/lib/postgresql/data"
    networks:
      - litellm-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    profiles: ["litellm"]
    build:
      context: .
      dockerfile: Dockerfile.litellm
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:-v1.103.2}
    image: "ai-lab-litellm:${LITELLM_VERSION:-v1.103.2}-healthfix"
    container_name: litellm
    restart: unless-stopped
    command: ["--config=/app/config.yaml"]
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - LITELLM_DISABLE_ENV_CREDENTIAL_LOGIN=${LITELLM_DISABLE_ENV_CREDENTIAL_LOGIN:-false}
      - LITELLM_TRUSTED_PROXY_RANGES=172.30.0.0/29,${TRAEFIK_FORWARDED_HEADERS_TRUSTED_IPS:-127.0.0.1/32}
      - LITELLM_MCP_XFF_NUM_TRUSTED_HOPS=${LITELLM_MCP_XFF_NUM_TRUSTED_HOPS:-1}
      - CHATGPT_TOKEN_DIR=/var/lib/litellm/chatgpt
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - "./config/litellm-config.yml:/app/config.yaml:ro"
      - "litellm-chatgpt-auth:/var/lib/litellm/chatgpt"
    networks:
      litellm-backend: {}
      litellm-clients: {}
      litellm-upstreams: {}
      litellm-ingress: {}
      traefik-public:
        gw_priority: 1
    labels:
      traefik.enable: "false"
      traefik.docker.network: litellm-ingress
      traefik.http.routers.litellm-ui.rule: "Host(`${LITELLM_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.litellm-ui.entrypoints: websecure
      traefik.http.routers.litellm-ui.priority: "100"
      traefik.http.routers.litellm-ui.tls.certresolver: letsencrypt
      traefik.http.routers.litellm-ui.middlewares: litellm-ui-allowlist@docker,secure-headers@docker
      traefik.http.routers.litellm-public-deny.rule: >-
        Host(`${LITELLM_SUBDOMAIN}.${DOMAIN}`) &&
        (Path(`/`) || Path(`/openapi.json`) || PathPrefix(`/docs`) ||
        PathPrefix(`/redoc`) || PathPrefix(`/swagger`) || PathPrefix(`/scalar`) ||
        PathPrefix(`/health`) || PathPrefix(`/public/`) ||
        PathRegexp(`^/(v1/)?(chat/completions|completions|embeddings|responses|models|images|audio|rerank|moderations|messages)(/.*)?$$`))
      traefik.http.routers.litellm-public-deny.entrypoints: websecure
      traefik.http.routers.litellm-public-deny.priority: "200"
      traefik.http.routers.litellm-public-deny.tls.certresolver: letsencrypt
      traefik.http.routers.litellm-public-deny.middlewares: secure-headers@docker,litellm-public-deny@docker
      traefik.http.routers.litellm-public-deny.service: litellm
      traefik.http.middlewares.litellm-ui-allowlist.ipallowlist.sourcerange: ${LITELLM_UI_ALLOWLIST:-127.0.0.1/32}
      traefik.http.middlewares.litellm-public-deny.ipallowlist.sourcerange: 127.0.0.1/32
      traefik.http.services.litellm.loadbalancer.server.port: "4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Dify — AI Application Platform (v1.13.3)
  # ===========================================================================
  dify-db:
    profiles: ["dify"]
    image: "postgres:16-alpine"
    container_name: dify-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dify
      - POSTGRES_PASSWORD=${DIFY_DB_PASSWORD}
      - POSTGRES_DB=dify
    volumes:
      - "dify-db-data:/var/lib/postgresql/data"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  dify-redis:
    profiles: ["dify"]
    image: "redis:7-alpine"
    container_name: dify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${DIFY_REDIS_PASSWORD}
    volumes:
      - "dify-redis-data:/data"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DIFY_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dify-sandbox:
    profiles: ["dify"]
    image: "langgenius/dify-sandbox:${DIFY_SANDBOX_VERSION:-0.2.14}"
    container_name: dify-sandbox
    restart: unless-stopped
    environment:
      - API_KEY=${DIFY_SANDBOX_KEY}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
      - SANDBOX_PORT=8194
    volumes:
      - "dify-sandbox-deps:/dependencies"
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dify-plugin-daemon:
    profiles: ["dify"]
    image: "langgenius/dify-plugin-daemon:${DIFY_PLUGIN_VERSION:-0.5.3-local}"
    container_name: dify-plugin-daemon
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresql
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify_plugin
      - SERVER_PORT=5002
      - SERVER_KEY=${DIFY_PLUGIN_DAEMON_KEY}
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${DIFY_PLUGIN_INNER_API_KEY}
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=true
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
    volumes:
      - "dify-plugin-data:/app/storage"
    networks:
      ai-net:
        gw_priority: 1
      litellm-clients: {}

  dify-api:
    profiles: ["dify"]
    image: "langgenius/dify-api:${DIFY_VERSION:-latest}"
    container_name: dify-api
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
      dify-sandbox:
        condition: service_healthy
    environment:
      - MODE=api
      - SECRET_KEY=${DIFY_SECRET_KEY}
      - MIGRATION_ENABLED=true
      - DEPLOY_ENV=PRODUCTION
      - CONSOLE_API_URL=https://dify.${DOMAIN}
      - CONSOLE_WEB_URL=https://dify.${DOMAIN}
      - APP_API_URL=https://dify.${DOMAIN}
      - APP_WEB_URL=https://dify.${DOMAIN}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${DIFY_REDIS_PASSWORD}@dify-redis:6379/1
      - STORAGE_TYPE=opendal
      - OPENDAL_SCHEME=fs
      - OPENDAL_FS_ROOT=storage
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=${DIFY_SANDBOX_KEY}
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${DIFY_PLUGIN_DAEMON_KEY}
      - INNER_API_KEY_FOR_PLUGIN=${DIFY_PLUGIN_INNER_API_KEY}
      - DB_PLUGIN_DATABASE=dify_plugin
      - LOG_LEVEL=INFO
      - PLUGIN_REMOTE_INSTALL_HOST=localhost
      - PLUGIN_REMOTE_INSTALL_PORT=5003
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://qdrant-compose:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - "dify-storage:/app/api/storage"
    networks:
      ai-net:
        gw_priority: 1
      litellm-clients: {}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dify-worker:
    profiles: ["dify"]
    image: "langgenius/dify-api:${DIFY_VERSION:-latest}"
    container_name: dify-worker
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      - MODE=worker
      - SECRET_KEY=${DIFY_SECRET_KEY}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${DIFY_REDIS_PASSWORD}@dify-redis:6379/1
      - STORAGE_TYPE=opendal
      - OPENDAL_SCHEME=fs
      - OPENDAL_FS_ROOT=storage
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=${DIFY_SANDBOX_KEY}
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=${DIFY_PLUGIN_DAEMON_KEY}
      - INNER_API_KEY_FOR_PLUGIN=${DIFY_PLUGIN_INNER_API_KEY}
      - DB_PLUGIN_DATABASE=dify_plugin
      - LOG_LEVEL=INFO
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://qdrant-compose:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - "dify-storage:/app/api/storage"
    networks:
      ai-net:
        gw_priority: 1
      litellm-clients: {}

  dify-beat:
    profiles: ["dify"]
    image: "langgenius/dify-api:${DIFY_VERSION:-latest}"
    container_name: dify-beat
    restart: unless-stopped
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    environment:
      - MODE=beat
      - SECRET_KEY=${DIFY_SECRET_KEY}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_DB_PASSWORD}
      - DB_HOST=dify-db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DIFY_REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${DIFY_REDIS_PASSWORD}@dify-redis:6379/1
      - LOG_LEVEL=INFO
      - ENABLE_CLEAN_MESSAGES=true
      - WORKFLOW_LOG_CLEANUP_ENABLED=true
      - WORKFLOW_LOG_RETENTION_DAYS=7
      - WORKFLOW_LOG_CLEANUP_BATCH_SIZE=100
    networks:
      - ai-net

  dify-web:
    profiles: ["dify"]
    image: "langgenius/dify-web:${DIFY_VERSION:-latest}"
    container_name: dify-web
    restart: unless-stopped
    depends_on:
      - dify-api
    environment:
      - CONSOLE_API_URL=https://dify.${DOMAIN}
      - APP_API_URL=https://dify.${DOMAIN}
      - CONSOLE_WEB_URL=https://dify.${DOMAIN}
      - APP_WEB_URL=https://dify.${DOMAIN}
      - MARKETPLACE_API_URL=https://marketplace.dify.ai
      - MARKETPLACE_URL=https://marketplace.dify.ai
    networks:
      - ai-net

  dify-nginx:
    profiles: ["dify"]
    image: "nginx:alpine"
    container_name: dify-nginx
    restart: unless-stopped
    depends_on:
      - dify-api
      - dify-web
    volumes:
      - "./config/dify-nginx.conf:/etc/nginx/nginx.conf:ro"
    networks:
      - ai-net
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dify.rule=Host(`dify.${DOMAIN}`)"
      - "traefik.http.routers.dify.entrypoints=websecure"
      - "traefik.http.routers.dify.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dify.middlewares=secure-headers@docker"
      - "traefik.http.services.dify.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
